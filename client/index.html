<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />

    <!--
      NEUTRAL BY CONSTRUCTION. This file is served byte-for-byte to every
      deployment of the platform, so nothing in it may name a village, link a
      village's host, or claim a canonical URL — a static file cannot know
      which fork it serves. The live identity arrives client-side: the title
      and favicon are repainted from /api/game/config (brand overlay over
      shared/gameConfig.ts) the moment it answers. What a crawler or a link
      preview reads (title, description, og:image, canonical) is spliced in
      per request by the server (server/lib/pageMeta.ts), from the village's
      own settings, so the tags below are only ever the fallback.
    -->
    <!--
      The first paint waits for /api/game/config; fetch it beside the bundle,
      not after it runs. Every deployment serves it. Keep `crossorigin`:
      without it fetch() cannot reuse this and downloads the config again.
    -->
    <link rel="preload" href="/api/game/config" as="fetch" crossorigin="anonymous" />

    <title>Village</title>
    <meta name="description" content="A coordination platform for a regenerative village: quests, recognition, circles, and shared stewardship." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Village" />
    <meta property="og:description" content="A coordination platform for a regenerative village: quests, recognition, circles, and shared stewardship." />

    <!-- Neutral platform favicon; the client swaps in the village's own. -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/platform-favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/images/platform-favicon.svg" />

    <!--
      Fonts are SELF-HOSTED: @fontsource imports in client/src/main.tsx bundle
      the woff2 files into /assets with content hashes. No request ever leaves
      this origin for a typeface — see main.tsx for the three reasons
      (privacy/GDPR, Google's CDN being blocked in China, speed).

      The stylesheet below is the village's own theme layer, served by this
      deployment's server from its brand document. For an untouched fork it is
      an empty file; a village that brings its own brand font (their
      deployment data, not platform code) gets its @import and font-stack
      overrides emitted here. Render-blocking on purpose: a late font swap is
      worse than a moment of fallback text.

      The server adds ?v=<version> to this link on every page it sends
      (server/routes/brandTheme.ts), so the href below must stay byte-exact:
      it is the anchor that splice looks for. The Vite dev server serves the
      bare URL.
    -->
    <link rel="stylesheet" href="/api/brand/theme.css" />
    <!--
      Served by the server from the brand overlay, for the same reason the
      stylesheet above is: this file ships byte-for-byte to every deployment,
      so a village's name cannot be baked into it.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Load analytics only when a real endpoint is configured at build time.
      // Prevents a 404 + SyntaxError on every page when the env vars are blank.
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.indexOf("%") !== -1 || !websiteId || websiteId.indexOf("%") !== -1) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.body.appendChild(s);
      })();
    </script>
  </body>

</html>
