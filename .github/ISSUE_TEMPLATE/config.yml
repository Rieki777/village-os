# Blank issues stay on. A form that does not fit is a worse outcome than an
# unstructured issue, and the three below cover the cases we can help with
# fastest, not every case there is.
blank_issues_enabled: true

# THESE THREE LINKS LEAVE YOUR VILLAGE, and the `about` lines say so.
#
# Everything else here is a FORM, and a form opens an issue in whatever
# repository it lives in. So a village that forked this gets its own bug
# reports, its own module proposals and its own operator questions, in its own
# tracker, without doing anything. Only the links below point upstream.
#
# That is right for all three, and the reason differs. A platform vulnerability
# reaches every village and no single village can fix it, so disclosure belongs
# in one place. The two documents are the platform's own and are what a fork is
# a fork OF.
#
# What was missing was the sentence. Somebody in the seventh village clicking
# "Security problem" landed in a stranger's repository, and a security report
# carries reproductions, screenshots, member names and email addresses. The
# routing was already correct; the reporter simply could not tell where their
# report was going.
contact_links:
  - name: Security problem, reported to the Village OS maintainers
    url: https://github.com/ReGen-Civics/village-os/security/advisories/new
    about: Goes privately to the platform maintainers, NOT to your village. A flaw here reaches every village, so it is fixed once for all of them. A public issue is a disclosure, and it reaches the villages last.

  - name: How to contribute to Village OS
    url: https://github.com/ReGen-Civics/village-os/blob/main/CONTRIBUTING.md
    about: The platform's own guide, not your village's. The gates, the writing rules, the migration rules, and how a module is reviewed.

  - name: Standing up or running a village
    url: https://github.com/ReGen-Civics/village-os/blob/main/docs/PROVISIONING.md
    about: The platform's walkthrough from nothing to a running instance with your own name on it. If your village has edited its own copy, read that one first.
