name: Village operator question
description: You are standing up or running an instance and something is unclear or stuck.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        You do not need to be a developer to open this. Say what you were trying to do in your own
        words and we will work out which part of the machinery it is.

        If the answer turns out to be missing from
        [the provisioning walkthrough](https://github.com/ReGen-Civics/village-os/blob/main/docs/PROVISIONING.md)
        or [the fork runbook](https://github.com/ReGen-Civics/village-os/blob/main/docs/FORK_RUNBOOK.md),
        that is a documentation bug and fixing it is part of answering you.

  - type: textarea
    id: goal
    attributes:
      label: What you were trying to do
      description: Plain language. "Get email working", "turn on a module", "move to my own domain".
    validations:
      required: true

  - type: textarea
    id: stuck
    attributes:
      label: Where it stopped
      description: >-
        The step you reached, and what the screen or the terminal said. Paste error text as text
        rather than a screenshot where you can, so it is searchable for the next person.
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build marker
      description: >-
        Open `/health` on your instance and paste the `build` field. If the instance will not start
        at all, write "will not start" and say what the logs show.
      placeholder: "paste the build field from /health, or: will not start"
    validations:
      required: true

  - type: dropdown
    id: hosting
    attributes:
      label: Who runs the hosting
      options:
        - I self-host it
        - ReGen Civics hosts it for me
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Do not paste secrets.** No connection strings, no API keys, no admin passwords, no member
        names or member content. If a value looks relevant, say which variable it is and describe
        what it holds. Anything you paste here is public the moment you post it.
