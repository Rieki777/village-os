# Publish the village image.
#
# The contract other lanes code against, and it does not change without a note
# in SEASON2_FLEET_LEDGER.md:
#
#   image   ghcr.io/rieki777/village-os
#   :<semver>   one immutable tag per release, e.g. :1.4.0. Cut by pushing an
#               annotated git tag v1.4.0.
#   :stable     moves to the newest non-prerelease semver. What a village
#               that has not opted into anything else should pull.
#   :edge       moves to the newest commit on main that ci passed. For us,
#               not for villages.
#
# THE GATE IS ci.yml, AND THIS FILE DOES NOT CARRY A COPY OF IT.
#
# A copied gate is a gate that drifts: the copy goes green on a suite that has
# quietly lost a step, and nobody finds out until the thing that step guarded
# ships to thirteen instances. So instead:
#
#   - on a main push, this workflow is TRIGGERED BY ci finishing, and runs
#     only when ci concluded success. There is no second opinion to disagree.
#   - on a tag, ci does not run at all (it is filtered to branches), so the
#     first job asks the API whether ci already passed on that exact commit
#     and refuses to publish if it did not.
#
# Either way the suite that decides is the one in .github/workflows/ci.yml,
# which the safety lane owns. This file only reads its verdict.
#
# NOTHING IS PUSHED UNTIL IT HAS BOOTED. The image is built into the runner's
# own docker daemon, started against an empty MySQL, and asked what commit it
# is and whether it can serve three pages. Only then does it reach the
# registry. Publishing first and smoking afterwards would mean :stable already
# points at the broken image by the time anyone finds out.

name: release

on:
  push:
    tags:
      # Semver, with or without a prerelease suffix. A prerelease publishes
      # its own tag but does NOT move :stable.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_run:
    workflows: [ci]
    types: [completed]
    # ONLY main. Without this filter every ci run fires a release run, and ci
    # runs on every branch and every pull request. Enabling Dependabot on
    # 2026-08-31 opened five PRs at once and produced eight release runs in
    # seven minutes on one commit. Nothing was published, because the plan job
    # correctly skipped its green-ci gate and took the image job with it, so
    # the workflow's own guards held. The cost was eight runners started for
    # work that could never publish, and that repeats on every batch.
    branches: [main]

permissions:
  contents: read
  packages: write

# Never cancel a publish in flight. A half-pushed manifest is worse than a
# redundant one, and these runs are rare.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # What are we building, what do we call it, and is it allowed out.
  # -------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For reading ci's verdict on a tagged commit.
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      tags: ${{ steps.decide.outputs.tags }}
    steps:
      - id: decide
        name: Decide the tags
        env:
          IMAGE: ghcr.io/rieki777/village-os
          EVENT: ${{ github.event_name }}
          GIT_TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          publish=false
          sha=""
          version=""
          tags=""

          if [ "$EVENT" = "push" ]; then
            # A tag push. The ref name is v1.4.0; the image tag is 1.4.0,
            # because the contract says :<semver> and semver has no v.
            version="${GIT_TAG#v}"
            sha="$TAG_SHA"
            tags="${IMAGE}:${version}"
            case "$version" in
              *-*)
                echo "::notice::${version} is a prerelease, so :stable is not moved."
                ;;
              *)
                # Newline separated: that is the list format build-push-action
                # reads. $'\n' rather than a literal line break so the value
                # does not depend on how YAML indents this block.
                tags="${tags}"$'\n'"${IMAGE}:stable"
                ;;
            esac
            publish=true

          elif [ "$EVENT" = "workflow_run" ]; then
            # ci finished. Publish :edge only for a green PUSH to main. A
            # pull_request run of ci reports the branch it came from and a
            # tree that does not exist on main, so it is not edge.
            # The :- defaults are for `set -u`: on the tag path these four are
            # empty, and an empty expression is not guaranteed to reach the
            # shell as a defined variable.
            if [ "${RUN_CONCLUSION:-}" = "success" ] \
               && [ "${RUN_EVENT:-}" = "push" ] \
               && [ "${RUN_BRANCH:-}" = "main" ]; then
              sha="${RUN_SHA:-}"
              tags="${IMAGE}:edge"
              publish=true
            else
              echo "Not an edge build: ci concluded '${RUN_CONCLUSION:-none}' on ${RUN_EVENT:-none}/${RUN_BRANCH:-none}."
            fi
          fi

          {
            echo "publish=${publish}"
            echo "sha=${sha}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "publish=${publish} sha=${sha}"
          echo "${tags}"

      - name: Require a green ci run on this commit
        # Tags only. The workflow_run path was already triggered BY a green
        # ci, so asking again would be asking the same question twice.
        #
        # Fails closed. If ci has never run on this commit there is nothing to
        # reuse, and publishing anyway would mean an image whose only claim to
        # being tested is that somebody typed `git tag`.
        if: github.event_name == 'push' && steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          set -euo pipefail
          green=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          echo "ci runs concluded success on ${SHA}: ${green}"
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::No successful ci run on ${SHA}. Tag a commit that has already gone green on main, or push the commit to a branch and let ci run before tagging it."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Can a village go back?
  #
  # A village upgrades by starting a new image, and the image applies every
  # pending migration AT BOOT, fail loud, with no approval gate. So the only
  # lever anybody has when a release goes wrong is to put the PREVIOUS image
  # back, and that lever only works if the previous release can still read and
  # write the schema this release produced. scripts/check-migration-compat.mjs
  # is what enforces that (expand, never contract); its header is the best
  # explanation of the contract in this repository.
  #
  # WHY THIS IS NOT A COPY OF ci's GATE, which this file otherwise refuses to
  # carry. ci runs the same guard on every push and compares each commit with
  # THE COMMIT BEFORE IT. That is the right comparison for catching a bad
  # migration as it lands. It is not the comparison a village makes: a village
  # moves from one RELEASE to the next, across every commit in between.
  #
  # Those are different spans, and the gap between them is not theoretical.
  # GitHub runs a workflow once per PUSH, not once per commit, so a push of
  # twenty commits is checked at the twentieth and the other nineteen are
  # checked by nothing. Measured 2026-09-02 over the 174 commits between v1.1.0
  # and main: of 25 sampled with the same query the plan job uses, 3 had a
  # green ci run, and ALL FIVE migrations added since 1.1.0 landed in commits
  # with none. On that span the rollback promise had never once been tested.
  #
  # So this asks the one question that only exists at a release boundary,
  # against a base ref that only exists at a release boundary. There is nowhere
  # else it could be asked. docs/RELEASING.md has the by-hand form, which is
  # worth running before tagging so a failure costs a command and not a run.
  # -------------------------------------------------------------------------
  rollback:
    needs: plan
    # Tag pushes only. :edge is not a release boundary and is explicitly not
    # for villages, so there is no rollback promise attached to it.
    if: needs.plan.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Phase 3 of the guard replays the previous release's migrations onto a
      # scratch schema, seeds representative rows, and only then applies the
      # new ones. Same tmpfs trick ci.yml uses, for the same reason: this is
      # almost all DDL and a scratch database has nothing to survive a crash
      # for.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-rollback
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,size=4g
          --health-cmd "mysqladmin ping -h localhost -pci-rollback"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # New migrations plus no TEST_DATABASE_URL exits 1 rather than skipping,
      # which is the polarity that makes this trustworthy.
      TEST_DATABASE_URL: mysql://root:ci-rollback@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The guard answers "what did the previous release have?" from git
          # alone, and needs every tag and every commit in between to do it.
          # The default fetch-depth of 1 cannot resolve a tag at all.
          fetch-depth: 0

      - name: Which release does this one have to be reversible to
        id: prev
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          # Described from the PARENT, so the tag being cut right now cannot
          # answer its own question. Prereleases are excluded because a village
          # on :stable never ran one, so it is not the version a rollback from
          # here would land on.
          prev=$(git describe --tags --abbrev=0 \
                   --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' \
                   "${SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "::notice::No earlier release tag is an ancestor of this commit, so there is no previous release to be reversible to. Passing."
          else
            echo "previous release: ${prev}"
          fi
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.prev.outputs.tag != ''

      - uses: actions/setup-node@v7
        if: steps.prev.outputs.tag != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.prev.outputs.tag != ''
        run: pnpm install --frozen-lockfile

      - name: Expand, never contract, across the whole release span
        if: steps.prev.outputs.tag != ''
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Asking whether ${PREV} can still run over the schema this release produces."
          node scripts/check-migration-compat.mjs --base "${PREV}"

      - name: Say what was checked
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          {
            echo "### Rollback"
            echo
            if [ -z "${PREV:-}" ]; then
              echo "No previous release tag. Nothing to be reversible to."
            else
              echo "A village on \`${PREV}\` can go back to it after taking this release: **${{ job.status }}**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Build, prove it boots, and only then push.
  #
  # One job on purpose. The obvious shape is build-and-push, then smoke the
  # published image, and it is wrong: by the time the smoke test says the image
  # cannot boot, :stable has already moved to it and thirteen villages are one
  # `docker pull` away from a broken instance. So the build loads into the
  # runner's own docker daemon, the smoke test boots THAT, and the push only
  # happens after. The push re-runs buildx against a fully warm cache, so it
  # uploads rather than rebuilds.
  # -------------------------------------------------------------------------
  image:
    needs: [plan, rollback]
    # `!cancelled()` is load-bearing and is not decoration. A job whose `needs`
    # were SKIPPED is skipped too unless its own `if` calls a status function,
    # and `rollback` is skipped on the :edge path. Without it, wiring rollback
    # in here would have silently stopped edge publishing altogether.
    #
    # `needs.plan.result == 'success'` is then required explicitly, because
    # `!cancelled()` also stops a failed `plan` from blocking this job.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && needs.rollback.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      # An empty database, for the smoke test. Same tmpfs trick ci.yml uses:
      # boot is almost all DDL and a smoke database has nothing to survive a
      # crash for.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-smoke
          MYSQL_DATABASE: village
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,size=4g
          --health-cmd "mysqladmin ping -h localhost -pci-smoke"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch by default, so the
          # commit has to be named explicitly or edge would build main's tip
          # rather than the commit ci actually passed.
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Into the runner's docker daemon, so the next step can run it.
          load: true
          tags: village-os:candidate
          # The build has no .git (see .dockerignore), so this argument is the
          # only thing that lets /health say which commit is serving.
          build-args: |
            GIT_SHA=${{ needs.plan.outputs.sha }}
          # linux/amd64 only, deliberately. arm64 would have to cross-build
          # bcrypt and sharp under emulation, which is slow and is exactly the
          # kind of thing that half-works. Add it when a village needs it, and
          # smoke-test it on real arm64 hardware when you do. `load` cannot
          # take a multi-platform result either, so adding arm64 means
          # rethinking this job rather than extending this line.
          platforms: linux/amd64
          # Scoped, because this shares the repo's 10 GB Actions cache with
          # ci's pnpm cache and eviction is repo-wide LRU. mode=max keeps the
          # dependency-install layers, which are the expensive ones and only
          # change when the lockfile does.
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: It boots, against an empty database
        # --network host because the MySQL service is published on the
        # runner's own 127.0.0.1, which a bridged container cannot reach.
        #
        # AUTH_TOKEN_SECRET is throwaway and is meant to be: it exists so the
        # smoke run takes the same path a real deployment takes rather than
        # the random-per-process fallback.
        run: |
          set -euo pipefail
          docker run -d --name village --network host \
            -e DATABASE_URL='mysql://root:ci-smoke@127.0.0.1:3306/village' \
            -e AUTH_TOKEN_SECRET='ci-smoke-not-a-secret' \
            -e PORT=3000 \
            village-os:candidate
          # 900 seconds. A cold boot against an empty schema was MEASURED at
          # 228 seconds on 2026-08-30 (107 migrations, then the token
          # registry, the seeds and the ledger invariant walk, all before
          # listen()). A CI runner is not obviously faster than that, and a
          # release gate that goes red on a slow boot teaches people to
          # ignore it.
          echo "waiting for /health (boot applies every migration before it listens)"
          for _ in $(seq 1 180); do
            if body=$(curl -fsS http://127.0.0.1:3000/health 2>/dev/null); then
              echo "$body"
              printf '%s' "$body" > health.json
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' village 2>/dev/null)" != "true" ]; then
              echo "::error::the container exited before it served /health"
              docker logs village || true
              exit 1
            fi
            sleep 5
          done
          if [ ! -s health.json ]; then
            echo "::error::/health never answered inside fifteen minutes"
            docker logs village || true
            exit 1
          fi

      - name: It knows which commit it is
        # The whole point of the build marker. If this reads "dev", the GIT_SHA
        # build argument did not reach scripts/build-server.mjs and every
        # deployment of this image would be anonymous.
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          build=$(jq -r .build health.json)
          short=$(printf '%s' "$SHA" | cut -c1-7)
          echo "marker: ${build}    expected to end in: ${short}"
          case "$build" in
            *"$short") echo ok ;;
            *)
              echo "::error::/health reports build '${build}', which does not carry ${short}. The image cannot say which commit it is."
              exit 1
              ;;
          esac

      - name: It serves the village, not just the probe
        # One page from each of the file sets the runtime stage copies by hand,
        # because a missing one of those is a silent degradation rather than a
        # crash and /health would still say ok.
        #   /                           dist/public, the SPA shell
        #   /grounds/manifest.json      docs/prototypes/grounds-v0.html
        #   /api/agent/v1/openapi.json  docs/skills/references
        run: |
          set -euo pipefail
          for path in / /grounds/manifest.json /api/agent/v1/openapi.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "${code}  ${path}"
            if [ "$code" != "200" ]; then
              echo "::error::${path} answered ${code}. Something the Dockerfile copies by hand is missing from the image."
              exit 1
            fi
          done

      - name: Container logs
        if: always()
        run: docker logs village || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ needs.plan.outputs.tags }}
          build-args: |
            GIT_SHA=${{ needs.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.title=village-os
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.licenses=MIT
          platforms: linux/amd64
          # Attestations turn the image into a multi-platform index carrying an
          # unknown/unknown entry. GHCR is fine with it; older self-hosted
          # docker and some mirrors are not, and this image is meant to be
          # pullable by thirteen operators we do not control.
          provenance: false
          # Every layer is already in this scope from the Build step above, so
          # this is an upload and not a second build.
          cache-from: type=gha,scope=release

      - name: Say what shipped
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' "${{ needs.plan.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo "commit: ${{ needs.plan.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
