# CI gate for a repo where pushing `main` deploys production (Railway).
# Keep this fast and boring: the same three commands every session runs locally
# (MODULES_MASTER_PLAN.md Part 2.3), plus an advisory audit and a bundle report.
#
# Order matters: build BEFORE test — server/loop.e2e.test.ts boots dist/index.js.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A branch push with an open PR fires this workflow TWICE: once for the push
# (the branch as it stands) and once for the pull_request (the branch already
# merged with main). Both are worth having and they test different trees, so
# neither trigger is removed. What IS waste is a superseded run: push twice in
# a minute and the first job keeps a runner for its full length while its
# result can no longer matter. The group keys on the event name as well as the
# ref so a push run never cancels the merge-with-main run that is the more
# valuable of the two; only a run of the SAME kind, on the SAME ref, that a
# newer commit has already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every step runs under bash, on purpose.
#
# GitHub's default shell for `run:` on Linux is `bash -e {0}`, which does NOT
# set pipefail: the exit status of `a | b` is b's. This workflow already has
# three pipes in the bundle-budget step, safe today only because that step
# tracks failures in a variable by hand. Reading a status through a pipe is
# how this project produced four false greens on a red tree in one day, so the
# shell is named here rather than inherited.
defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # S5: the DB-backed suites (server/db/*.test.ts) run against a real MySQL.
      # The harness provisions its own scratch schema and applies every
      # migration through the same engine production uses.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-test
        ports:
          - 3306:3306
        # The datadir lives in RAM. Provisioning is almost entirely DDL (140
        # CREATE TABLEs per scratch schema) and InnoDB fsyncs each one, so the
        # runner's disk was setting the price of the thing this job spends most
        # of its time on. A test database has nothing to survive a crash for.
        #
        # `--tmpfs` on the path the image declares as a volume replaces the
        # anonymous volume Docker would otherwise create, so first boot
        # initialises straight into memory. Nothing else about the container
        # changes, and the health check still gates the job on it being up.
        #
        # The size is stated rather than left to the daemon, because `--tmpfs`
        # has defaulted to 64 MB in some Docker versions and a datadir that
        # small fails in a way that reads as a MySQL bug. tmpfs allocates only
        # what is written, so 4g is a ceiling and not a reservation: a runner
        # has 16 GB, one scratch schema is about 15 MB of tables, and at most a
        # template and two or three scratch schemas exist at any moment.
        options: >-
          --tmpfs /var/lib/mysql:rw,size=4g
          --health-cmd "mysqladmin ping -h localhost -pci-test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: mysql://root:ci-test@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
        with:
          # The two migration guards below both ask "what did the PREVIOUS
          # release have?", and answer it from git. The default here is
          # `fetch-depth: 1`, a single commit with no remote-tracking refs, so
          # `origin/main` does not resolve and neither guard can run at all.
          #
          # Both are written to go RED rather than skip when they cannot
          # resolve a base, so the shallow default would have failed the job
          # loudly rather than passing it quietly. That is the right polarity
          # and it is still not a reason to leave the fetch shallow: a gate
          # that is red for a reason nobody can fix gets deleted.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" — one source of truth

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Typecheck tests
        # `pnpm check` above uses tsconfig.json, which EXCLUDES **/*.test.ts, so
        # it cannot see a test calling a helper with an old signature. That
        # surfaces thirty minutes into the suite as an assertion error instead.
        # This runs the same compiler over the test files. It sits here, before
        # the guards and the build, so an arity error fails in seconds.
        #
        # The runner starts cold, which is what makes this trustworthy: locally,
        # tsconfig.json's `incremental` cache does NOT re-check files whose
        # dependencies did not change, even after a compilerOptions change, so a
        # warm local run can report an error that is already fixed and can miss
        # one that is not. Delete node_modules/typescript/tsbuildinfo before
        # trusting a local result.
        run: npx tsc -p tsconfig.tests.json --noEmit

      - name: Migration numbers
        # Two migrations may not share a number, and no upstream migration may
        # take a number a village was promised.
        #
        # It has already gone wrong three times here and a person caught it
        # every time. `git log --all` at 052d042 shows 0062, 0063 and 0090 each
        # carrying two different files; two of those pairs were added on main;
        # the fix is its own commit, d0e09b9, "Renumber 0062-0065 to 0063-0066,
        # around a collision on main". Reviewer attention worked with one
        # deployment. It does not survive thirteen founder instances pulling
        # one image, because nobody is reading when a container boots.
        #
        # The runner sorts and records BY FILENAME with no checksum. Two files
        # on one number therefore run in the alphabetical order of their
        # DESCRIPTIONS, and two files with the same NAME are worse and silent:
        # the instance that already ran the old one has that name in
        # _migrations_applied, so the new body never runs and nothing says so.
        #
        # First, before the typecheck-adjacent guards, because it reads
        # filenames and git and needs neither node_modules nor a database.
        #
        # Watched RED five ways before wiring: a duplicate number, a filename
        # the runner's own discovery regex would skip, a file in the 9000+
        # village band, a burned gap number reused with no duplicate, and an
        # unresolvable base ref. The last one is the point of it: "did not run"
        # exits 1 and says so rather than printing the same line as "found
        # nothing".
        run: node scripts/check-migration-numbers.mjs

      - name: Migration compatibility (expand, never contract)
        # The gate above asks whether a migration can be TOLD APART from
        # another one. This asks whether landing it leaves the fleet
        # recoverable.
        #
        # Migrations are applied at boot, fail loud, by server/db/migrate.ts.
        # There is no separate migrate step and no approval: the container
        # starts and the founder's village is on the new schema whether or not
        # the new code works. When it does not, the only lever is to put the
        # previous image back, and that lever only works if the previous
        # release can still read and write the schema the migration produced.
        #
        # Four phases, each with its own count in the log so none can go
        # missing behind another one's success: git-only immutability of
        # shipped files, a scan for destructive statements that leave no schema
        # difference to find, the new migrations run against SEEDED ROWS on the
        # MySQL service above, and an information_schema contract diff.
        #
        # Phase 3 is the one that earns the runner time. The historical LPAD
        # collapse (LPAD truncates as well as pads, so a rename put two ids on
        # one value) passes reading, passes the destructive scan because it
        # carries a WHERE, and changes no column, type or constraint, so the
        # contract diff sees nothing at all. Against seeded rows it fails with
        # "Duplicate entry 'comp' for key 'PRIMARY'". Against empty tables the
        # identical file exits 0. Watched both ways.
        #
        # It needs the database, so it sits after the typechecks rather than
        # with the file-reading guards. A push with no new migration finishes
        # in under a second and says so; one with a new migration spends about
        # twenty five seconds replaying the previous release's schema once.
        #
        # New migrations plus no TEST_DATABASE_URL exits 1 rather than
        # skipping. The script's own header states in full what it cannot see,
        # so nobody rebuilds a bigger version believing the bigger version was
        # untried: meaning, the forward direction, the previous release's
        # actual code, triggers, collation, and a village's own migrations.
        run: node scripts/check-migration-compat.mjs

      - name: Guard self-tests, all of them
        # THE GUARDS HAVE SELF-TESTS AND NOTHING RAN MOST OF THEM.
        #
        # Filed by the gates lane and wired here because ci.yml has one owner.
        # Verified independently before wiring: vitest.config.ts includes
        # `server/**/*.test.ts`, `shared/**/*.test.ts` and `client/**/*.test.ts`
        # and nothing under `scripts/`, and none of these files end in `.ts`
        # anyway, so `pnpm test` cannot see them by two separate rules.
        # module-intake.yml cannot carry them either: it is path-gated on
        # shared/modules.ts and its friends, and none of those paths cover the
        # classifier or the scanner themselves.
        #
        # So a guard could have been regressed into uselessness and its own test
        # would have gone on passing in a file nobody executed. That is the
        # vacuous-pass shape the rest of this workflow exists to refuse, sitting
        # inside the guards' own test suite.
        #
        # Plain node, no database, sub-second each. All nine measured green at
        # a54d417 before wiring, so this starts from a known state rather than
        # from a hope.
        #
        # WHY A GLOB AND NOT THREE NAMES. This step used to name three files,
        # and a fourth was added below. scripts/ held nine. The five nobody
        # named ran nowhere at all, and two of them were the ones that matter
        # most: check-voice (the house writing rules on all shipped copy) and
        # check-migration-compat (a migration must leave the previous release
        # able to run). Naming them is what left the gap and would leave it
        # again for the tenth. scripts/run-self-tests.mjs globs, so a new
        # self-test is wired the moment it is saved, and it fails rather than
        # passing quietly if the glob ever matches nothing.
        run: node scripts/run-self-tests.mjs

      - name: Brand guard
        # S56: platform code carries no village's brand (invariant 2.1 #2).
        # Hard-clean zones must be spotless; ratchet zones may only burn down.
        # A fork inherits the platform by pulling — a welded-in village name
        # would travel with it.
        run: node scripts/check-brand-refs.mjs

      - name: Fork env audit
        # .env.example is the only list of what a founder must set, and it
        # calls itself the single source of truth. This compares it against
        # every env read in server/ and shared/, so a variable the code
        # started reading cannot stay unmentioned there.
        #
        # It sat unwired for its whole life: four documents named it, no
        # workflow and no package script ran it, and it exited 1 the day it
        # was wired in. A guard that does not run is a comment, and a path
        # resolving is not a guard running.
        run: node scripts/fork-env-audit.mjs

      - name: Voice guard
        # Shipped language follows the house writing rules (the Rye Voice
        # Profile). It reads only JSX text and string literals, parsed with
        # the TypeScript compiler, so comments and classNames cannot trip it.
        # A genuine false positive takes an inline `voice-ok: <reason>`.
        run: node scripts/check-voice.mjs

      - name: Dash guard
        # A hyphen standing in for a dash. check-voice structurally cannot see
        # this: it bans em-dashes and en-dashes, so the failure it creates is a
        # lone hyphen doing a dash's job, which reads as ordinary punctuation to
        # every rule it has. The script has existed since the round that found
        # fourteen glued compounds on public pages and was never wired in, which
        # converted UNCHECKED into PASSED for everything that landed since.
        # Watched RED before wiring: a probe carrying three glued compounds exits
        # 1 and names all three, while well-being and decision-making stay clean
        # and the thank-you allowlist holds. Clean at this ref.
        run: node scripts/check-hyphen-dash.mjs

      - name: Auth guard
        # A client call to a route that refuses strangers carries a token.
        # This deployment authenticates by `Authorization: Bearer` alone, with
        # no cookie fallback, so a call without it is a stranger's call. The
        # promise relay shipped that way past ten green route tests, because
        # every one of them set the header itself.
        #
        # The set of protected routes is read from the handlers, so it follows
        # the code and needs no list. It stays silent on calls it cannot read
        # whole, which is why it can be a hard gate.
        run: node scripts/check-auth-fetch.mjs

      - name: Admin reach guard
        # An admin write route that nothing in the browser calls is not a
        # feature a founder has. Two shipped that way and both were found by a
        # person reading files: DELETE /api/admin/org/seatings/:id and its
        # /forget sibling had their own test suite, their own e2e coverage, a
        # line in the runbook and no caller anywhere in client/src, so a village
        # could seat somebody and never unseat them and the
        # right-to-be-forgotten path was reachable only by curl.
        #
        # A green test suite says a route WORKS. It never says a founder can
        # reach it. The route list is read from the handlers and the caller list
        # from the client, so both follow the code; the standing-debt list
        # inside the script is a ratchet that may only shrink.
        run: node scripts/check-admin-reach.mjs

      - name: Save honesty guard
        # The guard above asks whether a founder can REACH a route. This one
        # asks whether the control that calls it tells the truth afterwards.
        #
        # A sweep of 434 client fetch calls found seventeen surfaces reporting
        # success without asking the server, six of them outright lies.
        # ContentEditorTab's button read "Saved!" on any answer at all, and
        # that route sits behind story.tell: a village holding that power
        # answers with the 409 the break-glass turns into a question, so an
        # operator who chose "Leave it" was shown "Saved!" for the change they
        # had just declined.
        #
        # It looks for one syntactic property and no more: the Response was
        # never held. A mutating call that is a statement of its own, or a
        # chain that reaches .then() without touching .ok or .status. The
        # script's header states in full what that cannot see, so nobody
        # rebuilds a bigger version believing the bigger version was untried:
        # a helper that reads the status and lies in its return value, the
        # optimistic write, the silence, and server-side reachability.
        #
        # Watched RED before wiring, against the REAL pre-fix tree rather than
        # a mock: the three files as of e238103^ exit 1 and name sixteen sites,
        # including the ContentEditorTab save and the submissions delete. The
        # same run confirms the documented blind spots are genuinely blind:
        # GuideChat reports zero, and SeasonPatternsTab's lying helper is not
        # among them. Clean at this ref, with five save-ok waivers.
        #
        # Before the build, with the other guards: it reads source files.
        run: node scripts/check-save-honesty.mjs

      - name: Repo payload guard
        # The guard above proves a founder can REACH a route. This one asks
        # whether the route works, because two shipped that could never succeed
        # in any version and every gate here passed them both.
        #
        # POST /api/admin/investor-docs/upload wrote {id, name, filename,
        # pageLink, uploadedAt} into a repo whose columns were {id, title,
        # description, url, requires_request, sort_order}. POST
        # /api/investor-docs/request, the public "send me the investor packet"
        # form, left `status` off its submissions insert. Both threw on every
        # call: an admin could press Upload and nothing was ever saved, and the
        # stewards' inbox was empty because no lead was ever captured.
        #
        # One line in server/repos/store-db.ts is the mechanism. dbCollection
        # names every spec'd column on every INSERT, so a key the caller did not
        # set arrives as an explicit NULL, and an explicit NULL is not an absent
        # column: the DEFAULT never applies. That turns an omission into a
        # guaranteed NOT NULL violation.
        #
        # Static, and it reads both halves from the code: the specs with the
        # TypeScript compiler, the NOT NULL columns from drizzle/. Same pass
        # checks that every spec'd column still exists in its table, which is
        # what breaks the boot SELECT when a spec and the schema drift apart.
        run: node scripts/check-repo-payloads.mjs

      - name: Mirror annotation guard
        # The client keeps small lookup tables beside the union types the server
        # sends: a hint per module lifecycle, words per ballot outcome, a colour
        # per decision method. Written Record<string, T> they are a promise
        # nobody checks, and a member added to the union in shared/ makes the
        # page render NOTHING where a sentence belonged. No error, no console
        # line, no failing test: an empty paragraph. Admin.tsx did exactly that
        # with LIFECYCLE_HINT.
        #
        # So this suggests the stronger key type, and only where it is free: the
        # map's keys must be EXACTLY the union's members, because Record<Union,T>
        # requires all of them and suggesting it for a partial map would hand
        # somebody a build error dressed as a fix. Nothing here judges a read, so
        # nothing here has to decide whether a fallback is honest.
        #
        # noUncheckedIndexedAccess was measured and is the wrong tool: 282 errors
        # repo-wide and it does NOT flag Record<Union,T>[keyTypedAsUnion], the
        # exact shape of both crashes that shipped.
        run: node scripts/check-mirror-annotations.mjs

      - name: Upload strip guard
        # A public, unauthenticated route wrote a stranger's file straight to
        # the uploads volume with multer's diskStorage, and /api/uploads served
        # it inline. A photograph taken on the land carries the land's GPS
        # position in its EXIF, so that route published the coordinates of a
        # rural land project to anyone with the link. The investor vault did
        # the same with no file filter at all.
        #
        # Both are fixed, and neither was fixed by a check that failed: they
        # were fixed because somebody read the file. The place-photo path had
        # shipped a runtime assertion a week earlier and it protected exactly
        # the files it was written for, because a guarantee attached to one
        # route is a guarantee about one route.
        #
        # So this asks the question that survives the next door being built:
        # does anything write into the uploads volume without coming through
        # server/lib/uploads.ts? It reads the handlers, so it follows the code.
        run: node scripts/check-upload-strip.mjs

      - name: Living map artifact budget
        # The bundle budget below measures dist/public. The living map is served
        # straight from docs/prototypes and never copied into dist, so it is the
        # largest thing this site sends to a phone and the one thing no budget
        # could see: 5.2 MiB on disk, 3.7 MiB gzipped, thirteen times the main JS
        # bundle. Exactly the blind spot the bundle budget's own comment names.
        #
        # Runs BEFORE the build because it needs no build: it reads a file in the
        # repo, so it fails in seconds rather than after pnpm build and pnpm test.
        run: node scripts/check-artifact-budget.mjs

      - name: Doc link guard
        # The documentation routes a reader to files by path, and it
        # deliberately links instead of restating so it cannot drift from the
        # code. That design has one failure mode: a file moves, every link to it
        # rots silently, and the first person to find out is the newcomer the
        # document exists to help.
        #
        # Scope is a glob: every .md under docs/ and at the repo root. It was a
        # hand-written list of six for months, which is how ninety documents
        # went unguarded and the one file appended to that list arrived with
        # three dead references in it. Opting a document out now costs a line
        # in the script's SKIPPED array with a reason attached.
        #
        # It runs BEFORE the build, with the other guards, because it reads
        # files that exist the moment the repo is cloned. Build outputs are
        # skipped for exactly that reason: dist/ is absent on a fresh runner and
        # resolving it here would make a correct document a red gate.
        run: node scripts/check-doc-links.mjs

      - name: Route reachability
        # Every gate above this line asks whether a page WORKS. This one asks
        # whether it can be REACHED.
        #
        # /campaigns shipped mounted, titled, module-gated, tested and correct,
        # and the only link to it in the whole client sat on /campaign/:slug,
        # which is itself only reachable from /campaigns. A closed loop, address
        # bar only, and green everywhere.
        #
        # So: two independent doors per route, one entrance allowed by name with
        # the reason written next to it. The route list is derived from the
        # router by scripts/qa/routes.mjs, so a page added tomorrow is measured
        # tomorrow, and the count of route-shaped strings the scanner could not
        # classify is printed even when it is zero.
        #
        # Before the build, with the other guards: it reads source files.
        run: node scripts/check-route-reachability.mjs

      - name: Living map route list
        # The gate above asks whether a route can be reached from the CLIENT. This
        # one asks whether the living map agrees the route exists at all.
        #
        # docs/prototypes/grounds-v0.html carries SITE_PAGES, its own allowlist of
        # the routes this app serves, and realRoute() returns '' for anything not on
        # it. So a door a founder places on a route the list has not caught renders,
        # carries an href, takes a click and does not navigate. No error, no console
        # line, nothing a test can see.
        #
        # It drifted four routes behind the router (/campaigns, /decisions, /propose,
        # /places) and THREE of those had already shipped as dead doors. The array is
        # derived output and nothing re-derived it, so it rotted at the speed pages
        # were added.
        #
        # Both halves of the comparison already existed in the tree, in two scripts
        # that never met: scripts/qa/routes.mjs derives the routes from App.tsx, and
        # docs/prototypes/patch_g1_04_routes_rederive.py reads the array back out.
        # This runs both and compares, with no browser and no build, which is what
        # makes it cheap enough to run on every push. Watched RED before wiring, on
        # the real four-route drift and on a route rename that leaves both counts at
        # 61, then GREEN after the re-derive it names put the file back byte for byte.
        #
        # Before the build, with the other guards: it reads two files in the repo.
        run: node scripts/check-map-routes.mjs

      - name: Image budget
        # Format, per-file size, and a total that may only fall.
        #
        # The bundle budget below already caps a single image at 400 KB, and it
        # is a CEILING with megabytes of slack: images could triple and stay
        # green. Nothing checked the FORMAT at all, so WebP was a convention,
        # which is to say it held until someone was in a hurry. This is the
        # ratchet, against scripts/image-budget-baseline.json, and
        # --update-baseline refuses to raise that number.
        #
        # Art that genuinely needs to grow goes in the uploads volume, which is
        # hashed, cached correctly and swappable. client/public is served
        # one-year-immutable and cannot be replaced for a year once cached.
        #
        # Before the build, same reason as the artifact budget above.
        run: node scripts/check-image-budget.mjs

      - name: Theme literals
        # A ratchet on hard-coded colour literals in the client, filed by the
        # tokens lane and wired here because ci.yml has one owner. Same shape
        # and same neighbourhood as the two budgets above: dependency-free, no
        # database, may only burn down. Baseline in
        # scripts/theme-literals-baseline.json, and --update-baseline refuses
        # to write a total above the one already committed.
        #
        # scripts/check-theme-literals.mjs AND its baseline live on
        # `wt/s2-tokens` and are NOT on the safety branch, so this step is red
        # here on purpose and goes green the moment the two branches are on
        # main together. It is wired hard rather than guarded with a "skip if
        # missing", because a step that quietly does nothing when its script is
        # absent is exactly the failure the rest of this file exists to stop.
        run: node scripts/check-theme-literals.mjs

      - name: Identity keys
        # No village's identity in the defaults every fork inherits.
        #
        # This exists because of a real outage on 2026-08-31: Amora's name,
        # nine image slots and its whole theme lived in shared/gameConfig.ts,
        # the file every future village copies. Emptying it so thirteen forks
        # would not ship wearing one village's face also emptied the live site,
        # because the live site was reading from those same defaults and its
        # database had never been seeded with its own copy. Every gate was
        # green throughout, and the founder found it on a phone.
        #
        # The brand guard cannot see this: shared/gameConfig.ts is its DECLARED
        # HOME and therefore exempt, which is correct for a fork filling that
        # file with its own name, and useless upstream. This check is
        # key-presence rather than word-matching, so it does not care what
        # proper nouns anyone used. Two of the three strings that leaked past
        # the brand guard contain no village name at all.
        #
        # It carries a dated KNOWN_PENDING list of keys that are still
        # populated on purpose, because blanking them before the founder has
        # entered them in Admin would repeat the outage. That list may only
        # shrink, and the guard prints it on every run so it cannot rot in
        # silence.
        #
        # Wired hard, not guarded with a skip-if-missing, for the reason the
        # step above gives: a step that quietly does nothing when its script is
        # absent is the failure this whole file exists to stop.
        run: node scripts/check-identity-keys.mjs

      # (check-identity-keys.test.mjs used to run here as its own step. It now
      # runs in `Guard self-tests, all of them`, above, with the other eight.)

      - name: Village facts in copy
        # No village's PRICES, units, token names or staff in the pages every
        # fork inherits. The step above guards the config; this one guards the
        # copy, which is where these were found.
        #
        # In one day this platform was found publishing, under every village's
        # name and with no admin field able to change any of it: four housing
        # price bands with square footages and a Reserve button, "Total Acres"
        # over a number a village meant as hectares, one token's name as
        # display text in 93 places across 29 files, a real person's first name
        # compiled into every fork, USD bands in the dropdown ON THE PAGE THAT
        # COLLECTS MONEY, eight more with no settings hook, a deposit band and
        # a hard dollar prefix. Every one survived because nothing was looking,
        # and each was found by somebody reading a page.
        #
        # The brand guard structurally cannot see any of it. It matches four
        # proper nouns and none of these facts contains one, and it exempts
        # seventeen shopfront pages, which is exactly where the money and the
        # units live. That exemption is about a village's own PROSE; it was
        # never a decision to let a price band with a submit button travel to a
        # fork.
        #
        # Ships with the 100 findings that exist today recorded per file and
        # per rule in scripts/village-facts-pending.json, so this starts from a
        # known state rather than from a hope. That list may only shrink, and
        # the guard fails if a count grows, if a file nobody listed appears, if
        # a listed count has fallen and the list still says the old number, or
        # if the total and PENDING_CEILING disagree.
        #
        # Wired hard, not guarded with a skip-if-missing, for the reason the
        # two steps above give: a step that quietly does nothing when its
        # script is absent is the failure this whole file exists to stop.
        run: node scripts/check-village-facts.mjs

      - name: E2E database isolation
        # Every suite that spawns the built server must hand it its own scratch
        # schema. All 41 do; nothing enforced it, and the 42nd that forgets the
        # line does not fail, it passes against a real database and writes as it
        # goes. The one convention here whose failure reaches a village.
        run: node scripts/check-e2e-db-isolation.mjs

      - name: E2E port windows
        # Every e2e suite picks its own port as BASE + (process.pid % WIDTH) and
        # nothing checked the arithmetic. One suite used a FIXED port, five bases
        # were shared by eleven files, and the survey comments in the files' own
        # headers had gone stale and were telling readers a false thing about the
        # tree. This is that survey, executable. Sub-second, no database.
        run: node scripts/check-e2e-ports.mjs

      - name: File line ratchet
        # Tracked files may only shrink. Written months ago and wired to
        # nothing: not CI, not package.json, not another script. An unwired
        # guard in the tree reads to the next contributor as coverage that
        # exists. Green at a54d417 before wiring.
        run: node scripts/check-file-lines.mjs

      - name: Tailwind gray ratchet
        # Same story, same fix: present in the tree, invoked by nothing.
        run: node scripts/check-tailwind-gray.mjs

      - name: Token doc
        # docs/TOKENS.md is GENERATED from the migrations and the server
        # source, and this is the step that makes it worth reading. It
        # regenerates the document and fails when the committed text and the
        # code have come apart, which happens whenever somebody changes a
        # token, a faucet, a sending rule or a seeded mint rule and does not
        # run the generator.
        #
        # A generated document with no guard behind it is a hand-written
        # document with extra steps: correct the day it lands and quietly wrong
        # a month later, which is what happened to the three places
        # FORK_RUNBOOK told a founder to rename their token.
        #
        # Dependency-free, no database. The deeper proof (that the generator's
        # SQL reader agrees with a real MySQL, and that its wording agrees with
        # the functions it describes) is server/db/tokenDoc.test.ts, in the
        # suite below.
        run: node scripts/check-token-doc.mjs

      - name: Token doc, self-test
        # The generator's own fixture suite: the UPDATE sweep it exists to
        # catch, the statement shapes it must refuse rather than skip, and the
        # two escape-hatch directives. A reader nobody has proven can refuse is
        # a reader that reports green either way.
        run: node scripts/generate-token-doc.test.mjs

      - name: Server index size
        # The monolith ratchet: server/index.ts may only ever shrink, in lines
        # AND in route registrations, and no file under server/routes/ may pass
        # 2,000 lines so it cannot simply move house.
        #
        # It has been enforced only through the last describe in
        # server/serverIndexRatchet.test.ts, which pnpm test reaches at line 487
        # of this file. That works, and it puts the one gate protecting the
        # architecture behind the slowest step in the run, after the build. A
        # contributor who adds a route waits for the whole suite to find out.
        #
        # Named here as its own step for two reasons: it fails in seconds
        # instead of minutes, and a required check can point at it by name.
        # Dependency-free, no database.
        run: node scripts/check-server-index-size.mjs

      - name: Route limits
        # A route anybody can reach, that a stranger can turn into cost the
        # village cannot refuse, has to be bounded.
        #
        # This replaces CodeQL's js/missing-rate-limiting, which is filtered
        # out in .github/codeql/codeql-config.yml because it cannot see any of
        # the three ways this server bounds a request and reported 98 alerts
        # holding zero unauthenticated writes. This one recognises the 429
        # rather than a helper's name, so all three shapes count, and it reads
        # all 590 routes in about a third of a second.
        #
        # Dependency-free, no database.
        run: node scripts/check-route-limits.mjs

      - name: Build
        id: build
        # Runs even behind a failed guard, for the same reason the suite does,
        # and because the suite is useless without it: the e2e reach tests read
        # dist/index.js directly and fail with "dist/index.js is missing" if it
        # was never produced. Measured, not assumed: with only the suite made
        # conditional, a deliberately failed doc guard gave Build: skipped and
        # Test: failure, and that failure named the missing bundle rather than
        # anything a reader could act on.
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Test
        # RUNS EVEN WHEN AN EARLIER GUARD FAILED. This job is 35 sequential
        # steps and the suite is the 33rd, so without this one red guard means
        # the tests never ran and the build reports a single red step either
        # way. CI was red for five commits that way, and for those five nothing
        # exercised the code at all. A guard failure and a test failure are
        # different facts and the build should report both.
        #
        # `!cancelled()` rather than `always()`, deliberately. This workflow
        # sets cancel-in-progress on a group keyed by ref, and with the current
        # merge rate runs are cancelled constantly: three of mine were
        # cancelled inside 90 seconds one afternoon. `always()` would keep a
        # ten-minute suite running on every one of them. `!cancelled()` keeps
        # the point of the change, which is that a failing guard no longer
        # hides the suite, without paying for runs nobody is waiting on.
        # Gated on the build SUCCEEDING, not merely on not-cancelled. A suite
        # run against a bundle that was never built reports a missing file and
        # buries the real failure, which is worse than not running at all.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test

      - name: Bundle budget
        # A report nobody reads is not a guard. The plan called for a threshold
        # "as a two-line change; do the splitting when the line goes red" — so
        # here is the line. It is a RATCHET on the main JS bundle: growth is
        # normal as modules land, silent doubling is not, and a village on a
        # phone in rural Costa Rica pays for every kilobyte.
        #
        # When this fails, the fix is usually code-splitting the admin bundle
        # (React.lazy on the /admin route), not raising the number.
        #
        # Three numbers, because one was not enough. The main-JS budget was the
        # only thing measured, so 178 KB of CSS and 1.7 MB of images grew
        # entirely unwatched — and images are exactly what this platform is
        # about to add a lot more of. A gate that cannot see the thing you are
        # adding is not a gate.
        #
        # MAX_MAIN_JS_KB was 1400 and the bundle sat at 1382. Route splitting
        # (React.lazy on everything but Home and Login, see client/src/App.tsx)
        # took it to ~494, so the ratchet drops to 700: comfortable room for
        # genuine growth in the shared shell, no room for a page to slip back
        # into the main chunk by being imported eagerly somewhere.
        #
        # THE TWO NUMBERS MEASURE DIFFERENT THINGS, and the step used to hide
        # that. `du -sk` reports ALLOCATED BLOCKS, and the runner's ext4
        # filesystem hands a whole 4096 bytes to every file however small it
        # is. So the total was reading about 700 KB heavier than the bytes on
        # disk, a lane measuring real bytes locally saw headroom CI did not
        # have, and CLAUDE.md had to say "nothing local reproduces them".
        #
        # Worse, the two budgets point in opposite directions. MAX_MAIN_JS_KB
        # is real bytes on one file, so SPLITTING a chunk lowers it.
        # MAX_TOTAL_DIST_KB is block-charged across the tree, so splitting
        # RAISES it: a 400-byte chunk spends four kilobytes of the ceiling.
        # A build tuned for the first budget quietly spends the second.
        #
        # scripts/check-dist-budget.mjs now enforces both and prints both, and
        # a lane can run the identical measurement before pushing. The budget
        # numbers still live here, and the script reads them from this file
        # when the environment does not supply them, so there is one authority.
        env:
          MAX_MAIN_JS_KB: 700
          MAX_TOTAL_DIST_KB: 6600
          MAX_SINGLE_IMAGE_KB: 400
        run: |
          echo "## Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          fail=0

          node scripts/check-dist-budget.mjs || fail=1

          # A second opinion on the total, from the tool the budget was written
          # against. If these two ever disagree, the script is wrong about how
          # this filesystem charges for a file and the discrepancy is the bug.
          #
          # Both numbers go to the LOG as well as the summary. The old step sent
          # every number to $GITHUB_STEP_SUMMARY alone, so the total was
          # invisible to anyone reading the log, which is most of the reason
          # nobody noticed the block-padding gap for as long as they did.
          du_kb=$(du -sk dist/public | awk '{print $1}')
          model_kb=$(GITHUB_STEP_SUMMARY= node scripts/check-dist-budget.mjs --json --report \
            | sed -n 's/.*"blockChargedKb": *\([0-9]*\).*/\1/p')
          echo "du -sk reports ${du_kb} KB, the script modelled ${model_kb} KB (budget ${MAX_TOTAL_DIST_KB} KB)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$du_kb" != "$model_kb" ]; then
            echo "::warning::du -sk says ${du_kb} KB and scripts/check-dist-budget.mjs says ${model_kb} KB. The script models how ext4 charges for directories, so a block or two of drift is expected; a larger gap means the model needs revisiting."
          fi
          if [ "$du_kb" -gt "$MAX_TOTAL_DIST_KB" ]; then
            echo "::error::du -sk puts dist/public at ${du_kb} KB, over the ${MAX_TOTAL_DIST_KB} KB budget. Check whether something large landed in client/public and belongs in the uploads volume, and run node scripts/check-dist-budget.mjs to see how much of that is 4 KB block padding."
            fail=1
          fi

          # Any single oversized image. client/public/assets is served
          # one-year-immutable and Vite does not content-hash passthrough
          # files, so a fat PNG there is both slow AND unreplaceable for a
          # year. Foundation art belongs in the uploads volume, which is
          # hashed, cached correctly, and swappable.
          while IFS= read -r f; do
            kb=$(( $(stat -c%s "$f") / 1024 ))
            if [ "$kb" -gt "$MAX_SINGLE_IMAGE_KB" ]; then
              echo "::error::${f} is ${kb} KB, over the ${MAX_SINGLE_IMAGE_KB} KB per-image budget. Compress it, or serve it from the uploads volume rather than static assets."
              fail=1
            fi
          done < <(find dist/public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' \))

          exit $fail

      - name: Dependency audit
        # BLOCKING on FINDINGS, and deliberately not blocking on a registry that
        # will not answer. Those are two different facts and `pnpm audit` returns
        # one exit code for both.
        #
        # On 2026-09-04 registry.npmjs.org served its root in 0.34s while
        # /-/npm/v1/security/audits hung, npm's status page said All Systems
        # Operational, and every merge in this repository stopped, main included.
        # Nothing was wrong with any code. scripts/dependency-audit.mjs now
        # retries, then tells an ANSWER apart from a failure to ask, and only
        # ever fails the build on an answer. Its reasoning is in its header and
        # scripts/dependency-audit.test.mjs proves a high advisory still exits 1.
        #
        # If an advisory has no upstream fix, add a documented `pnpm.overrides`
        # or an explicit ignore with a dated reason. Do not re-add
        # continue-on-error: it cannot tell the two cases apart either.
        run: node scripts/dependency-audit.mjs
