# The self-host path, walked the way a founder walks it.
#
# A clean checkout, `fork-init --compose` writing `.env`, `docker compose up`,
# then the first things a founder needs, in order: the server answers /health,
# the boot migrations finished, /claim serves the page, a founder account can
# be claimed and signed into, the server says what it is, and a new village
# starts without the brochure pages. Then a restart, which must apply nothing.
#
# It runs on any pull request that touches the compose path, and by hand
# against a PUBLISHED image (the `image` input), which is how a release is
# proven to pull and boot against an empty MySQL after it is tagged.
#
# Nothing here reads a secret. Every credential is generated by fork-init on
# the runner and dies with it.
name: selfhost-smoke

on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker-compose.build.yml
      - Dockerfile
      - .dockerignore
      - .env.example
      - scripts/fork-init.mjs
      - drizzle/**
      - .github/workflows/selfhost-smoke.yml
  workflow_dispatch:
    inputs:
      image:
        description: "A published image to run instead of building this commit, for example ghcr.io/regen-civics/village-os:1.2.1"
        required: false
        default: ""
  workflow_call:
    inputs:
      image:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selfhost-smoke-${{ github.ref }}-${{ inputs.image || 'build' }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: http://127.0.0.1:3000
      IMAGE: ${{ inputs.image || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Write .env the way a founder does
        run: |
          set -euo pipefail
          node scripts/fork-init.mjs --compose --village-name "Smoke Test" --admin-email founder@example.org
          # The founder password must not have been printed. It is in .env.
          test -s .env
          grep -q '^ADMIN_PASSWORD=.\+' .env
          grep -q '^DATABASE_URL=mysql://village:.*@db:3306/village$' .env
          if [ -n "$IMAGE" ]; then
            sed -i "s#^VILLAGE_OS_IMAGE=.*#VILLAGE_OS_IMAGE=${IMAGE}#" .env
            grep -q "^VILLAGE_OS_IMAGE=${IMAGE}$" .env
          fi

      - name: Start the village
        run: |
          set -euo pipefail
          if [ -n "$IMAGE" ]; then
            echo "Running the published image ${IMAGE}"
            docker compose pull app
            docker compose up -d
          else
            echo "Building this commit with docker-compose.build.yml"
            GIT_SHA="${GITHUB_SHA}" docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
          fi
          docker compose ps

      - name: Wait for /health (every migration runs before the server listens)
        run: |
          set -euo pipefail
          start=$(date +%s)
          for _ in $(seq 1 180); do
            if body=$(curl -fsS "$BASE/health" 2>/dev/null); then
              echo "$body" | tee health.json
              echo "answered after $(( $(date +%s) - start ))s"
              exit 0
            fi
            state=$(docker compose ps app --format '{{.State}}' 2>/dev/null || true)
            if [ "$state" = "exited" ]; then
              echo "::error::the app container exited before it served /health"
              docker compose logs --no-color app | tail -200
              exit 1
            fi
            sleep 5
          done
          echo "::error::/health never answered inside fifteen minutes"
          exit 1

      - name: The boot migrations finished
        run: |
          set -euo pipefail
          docker compose logs --no-color app > app.log
          grep -E '\[db\] applied [0-9]+ migration\(s\)' app.log
          applied=$(grep -oE '\[db\] applied [0-9]+ migration' app.log | grep -oE '[0-9]+' | tail -1)
          files=$(ls drizzle/*.sql | wc -l)
          echo "applied ${applied} of ${files} migration file(s) on an empty database"
          [ "$applied" = "$files" ] || { echo "::error::an empty database should have applied every file"; exit 1; }
          jq -e '.database.ok == true' health.json

      - name: /claim serves the page
        run: |
          set -euo pipefail
          code=$(curl -s -o claim.html -w '%{http_code}' "$BASE/claim")
          echo "/claim answered ${code}"
          [ "$code" = "200" ]
          grep -q 'id="root"' claim.html

      - name: A founder account can be claimed and signed into
        run: |
          set -euo pipefail
          pw=$(grep '^ADMIN_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS -X POST "$BASE/api/admin/bootstrap" -H 'Content-Type: application/json' \
            -d "{\"email\":\"founder@example.org\",\"password\":\"${pw}\",\"name\":\"Smoke Founder\"}" > claim.json
          jq -e '.success == true and (.claimUrl | test("/set-password\\?token="))' claim.json > /dev/null
          token=$(jq -r '.claimUrl' claim.json | sed -E 's#.*token=##' | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))')
          curl -fsS -X POST "$BASE/api/auth/set-password" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$token" '{token: $t, password: "smoke-test-founder-1"}')" > set.json
          jq -e '.success == true and .user.role == "founder"' set.json > /dev/null
          curl -fsS -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"founder@example.org","password":"smoke-test-founder-1"}' > login.json
          jq -e '.token | length > 20' login.json > /dev/null
          # The shared password stops working once the village has a founder.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/api/admin/bootstrap" -H 'Content-Type: application/json' \
            -d "{\"email\":\"someone@example.org\",\"password\":\"${pw}\"}")
          echo "a second bootstrap answered ${code}"
          [ "$code" = "403" ]

      - name: It says what it is
        run: |
          set -euo pipefail
          curl -fsS "$BASE/api/platform/info" > info.json
          jq '{product, platform, version, build}' info.json
          want=$(node -p "require('./package.json').version")
          jq -e --arg v "$want" '.product == "Village OS" and .version == $v' info.json > /dev/null

      - name: A new village starts without the brochure pages
        run: |
          set -euo pipefail
          curl -fsS "$BASE/api/game/config" | jq -e '.brochurePages == false' > /dev/null
          curl -fsS "$BASE/sitemap.xml" > sitemap.xml
          grep -q '/quests<' sitemap.xml
          if grep -qE '/(investor|love-letter|master-plan)<' sitemap.xml; then
            echo "::error::the sitemap lists brochure pages on a new village"
            exit 1
          fi

      - name: A restart applies nothing and comes back
        run: |
          set -euo pipefail
          # The container keeps its log across a restart, so count the
          # "applied" lines before and after: a second boot that applied
          # nothing prints none, and the count stays where the first boot left it.
          before=$(docker compose logs --no-color app | grep -cE '\[db\] applied [0-9]+ migration' || true)
          docker compose restart app
          sleep 10
          for _ in $(seq 1 120); do
            curl -fsS "$BASE/health" > /dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS "$BASE/health"
          echo
          after=$(docker compose logs --no-color app | grep -cE '\[db\] applied [0-9]+ migration' || true)
          echo "applied-lines before ${before}, after ${after}"
          [ "$after" = "$before" ] || { echo "::error::the restart applied migrations again"; exit 1; }

      - name: Back up with the commands START_HERE.md gives a founder
        run: |
          set -euo pipefail
          # One file in the uploads volume, so the restore has something to prove.
          docker compose exec -T app sh -c 'mkdir -p /app/data/uploads && printf canary > /app/data/uploads/smoke-canary.txt'
          mkdir -p backups
          docker compose exec -T db sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --no-tablespaces village' | gzip > backups/village-$(date +%F).sql.gz
          docker run --rm -v village-os_village-data:/data:ro -v "$PWD/backups":/backup alpine tar czf /backup/uploads-$(date +%F).tar.gz -C /data .
          ls -la backups
          gunzip -c backups/village-*.sql.gz | grep -c '^INSERT INTO `users`'
          tar tzf backups/uploads-*.tar.gz | grep -q 'smoke-canary.txt'

      - name: Wipe everything, restore with the documented commands, sign in again
        run: |
          set -euo pipefail
          compose="docker compose"
          if [ -z "$IMAGE" ]; then compose="docker compose -f docker-compose.yml -f docker-compose.build.yml"; fi
          $compose down -v
          # The date the backup step stamped, read back, so a run that crosses
          # midnight still restores the files it just wrote.
          DATE=$(ls backups/village-*.sql.gz | head -1 | sed -E 's#.*village-(.*)\.sql\.gz#\1#')
          echo "restoring the backup of ${DATE}"
          $compose up -d db
          for _ in $(seq 1 60); do
            [ "$($compose ps db --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          gunzip -c backups/village-$DATE.sql.gz | $compose exec -T db sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" village'
          $compose create app
          docker run --rm -v village-os_village-data:/data -v "$PWD/backups":/backup alpine tar xzf /backup/uploads-$DATE.tar.gz -C /data
          $compose up -d
          for _ in $(seq 1 120); do
            curl -fsS "$BASE/health" > /dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS "$BASE/health"
          echo
          # A restored database is already migrated, so this boot applies nothing.
          if $compose logs --no-color app | grep -E '\[db\] applied [0-9]+ migration'; then
            echo "::error::the restored village re-applied migrations, so the dump did not carry the migration ledger"
            exit 1
          fi
          curl -fsS -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"founder@example.org","password":"smoke-test-founder-1"}' | jq -e '.user.role == "founder"' > /dev/null
          $compose exec -T app cat /app/data/uploads/smoke-canary.txt | grep -qx canary
          echo "Restore drill passed: the founder signs in to the restored village, and the uploaded file came back."

      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -400

      - name: Stop
        if: always()
        run: docker compose down -v
